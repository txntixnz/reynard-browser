name: iOS 16 Stability Test

on:
  push:
    branches: [ios16-stability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios16-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Session regression checks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Parse changed Swift files
        run: |
          swiftc -frontend -parse browser/Reynard/Client/SessionManagement/SessionManager.swift
          swiftc -frontend -parse browser/Reynard/Client/TabManagement/TabManagerImpl.swift
      - name: Run session regression checks
        run: python3 tests/stability/run.py

  build:
    needs: regression
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.sha }}
      nightly: false
      build_normal_ipa: false
      build_trollstore_tipa: true
      build_jailbroken_ipa: false
